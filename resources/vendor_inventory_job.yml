resources:
  jobs:
    vendor_inventory_pipeline:
      name: vendor-inventory-pipeline

      # Every morning at 6am Toronto time: land the latest vendor exports, then rebuild the tables.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: land_raw_exports
          environment_key: default
          python_wheel_task:
            package_name: vendor_pipeline
            entry_point: vip-land-raw
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--schema", "${var.schema}",
                         "--end", "${var.end_date}", "--market", "${var.market}"]

        - task_key: bronze_silver_gold
          depends_on:
            - task_key: land_raw_exports
          environment_key: default
          python_wheel_task:
            package_name: vendor_pipeline
            entry_point: vip-run-pipeline
            parameters: ["--env", "databricks", "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

      # Serverless compute: no cluster to configure (the only option on Free Edition)
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
